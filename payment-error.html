<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لم تكتمل عملية الدفع | فروستا</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Tajawal',sans-serif; background:#FBF7EF; color:#12222B;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:#fff; border-radius:22px; padding:48px 36px; max-width:460px; width:100%;
    text-align:center; box-shadow:0 20px 50px rgba(14,42,61,.12);
  }
  .icon{
    width:74px;height:74px;border-radius:50%; margin:0 auto 24px; background:rgba(124,45,59,.1);
    display:flex;align-items:center;justify-content:center; font-size:34px; color:#7C2D3B;
  }
  h1{font-family:'Aref Ruqaa',serif; color:#0E2A3D; font-size:26px; margin-bottom:14px;}
  p{color:#5C7080; font-size:15px; line-height:1.8; margin-bottom:8px;}
  a.btn{
    display:inline-block; margin-top:26px; background:#C79A4B; color:#0E2A3D; text-decoration:none;
    padding:14px 30px; border-radius:100px; font-weight:700; font-size:14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✕</div>
    <h1>لم تكتمل عملية الدفع</h1>
    <p>حدث خلل أثناء تنفيذ عملية الدفع، أو تم إلغاؤها. لم يتم خصم أي مبلغ.</p>
    <p>يمكنك المحاولة مرة أخرى أو التواصل معنا عبر واتساب لإتمام طلبك.</p>
    <a href="/" class="btn">المحاولة مرة أخرى</a>
  </div>
</body>
</html>
