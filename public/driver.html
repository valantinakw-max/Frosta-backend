<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>فروزينا — السائق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E2A3D; --navy-deep:#081A26; --gold:#C79A4B; --berry:#7C2D3B; --ok:#1f8a5b;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif;}
  body{background:#f4f6f8; color:#1c2b36; min-height:100vh;}
  header{
    background:var(--navy-deep); color:#fff; padding:14px 18px;
    display:flex; justify-content:space-between; align-items:center;
    position:sticky; top:0; z-index:50;
  }
  header h1{font-size:17px; font-weight:900;}
  header h1 span{color:var(--gold);}
  .btn{
    border:none; cursor:pointer; border-radius:100px; font-weight:700;
    font-size:13px; padding:9px 16px; font-family:inherit;
  }
  .btn:active{opacity:.7;}
  .btn-gold{background:var(--gold); color:var(--navy-deep);}
  .btn-ghost{background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.35);}
  .btn-ok{background:var(--ok); color:#fff;}
  .btn-navy{background:var(--navy); color:#fff;}
  .btn-lg{padding:13px 20px; font-size:15px; width:100%;}
  .btn-sm{padding:7px 12px; font-size:12px;}

  .login-wrap{max-width:380px; margin:60px auto; padding:0 18px;}
  .card{background:#fff; border-radius:16px; padding:22px; box-shadow:0 4px 20px rgba(0,0,0,.06);}
  .card h2{font-size:18px; margin-bottom:14px; color:var(--navy);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:13px; font-weight:700; margin-bottom:5px; color:var(--navy);}
  .field input{
    width:100%; padding:12px 13px; border-radius:10px; border:1.5px solid #d7dde3;
    font-family:inherit; font-size:15px;
  }
  .err{color:var(--berry); font-size:13px; font-weight:600; margin-top:8px; display:none;}
  .err.show{display:block;}

  main{max-width:640px; margin:0 auto; padding:16px;}
  .my-orders-title{font-size:15px; font-weight:900; color:var(--navy); margin:6px 0 12px;}
  .order-card{
    background:#fff; border-radius:16px; padding:16px; margin-bottom:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.06); border-right:5px solid var(--gold);
  }
  .order-card.done{border-right-color:var(--ok); opacity:.75;}
  .oc-top{display:flex; justify-content:space-between; margin-bottom:8px;}
  .oc-top .inv{font-weight:900; color:var(--navy); font-size:16px;}
  .oc-top .tot{font-weight:900; color:#8a6a2f; font-size:16px;}
  .oc-meta{font-size:14px; color:#43525c; line-height:1.9; margin-bottom:12px;}
  .oc-meta b{color:#1c2b36; font-size:15px;}
  .row-btns{display:flex; gap:8px; flex-wrap:wrap;}
  .row-btns .btn{flex:1; min-width:100px; text-align:center; text-decoration:none; display:inline-block;}
  .empty{text-align:center; color:#8a97a1; padding:50px 0; font-size:15px;}
  .badge{display:inline-block; padding:4px 12px; border-radius:100px; font-size:12px; font-weight:700; margin-bottom:6px;}
  .b-out{background:#cfe2ff; color:#084298;}
  .b-ready{background:#fff3cd; color:#856404;}
  .hidden{display:none !important;}
  .hello{font-size:13px; color:#5a6a75; margin-bottom:10px;}
</style>
</head>
<body>

<header>
  <h1>فروزينا <span>| السائق</span></h1>
  <button class="btn btn-ghost btn-sm hidden" id="logoutBtn">خروج</button>
</header>

<div class="login-wrap" id="loginView">
  <div class="card">
    <h2>🚗 دخول السائق</h2>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="lgEmail" placeholder="driver1@frozina.com" autocomplete="email" inputmode="email">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="lgPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-gold btn-lg" id="lgBtn">دخول</button>
    <p class="err" id="lgErr"></p>
  </div>
</div>

<main id="boardView" class="hidden">
  <p class="hello" id="helloLbl"></p>
  <h2 class="my-orders-title">📦 طلباتي</h2>
  <div id="ordersList"><p class="empty">جاري التحميل...</p></div>
</main>

<script>
  const SUPABASE_URL = 'https://pqkbqkfliyarpvdckgls.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_mbOAoWTolvgpwyD-5My09Q_01GOlbqC';

  let session = null, myDriver = null, orders = [];

  function saveSession(s){ session = s; try{ localStorage.setItem('frozina_driver', JSON.stringify(s)); }catch(e){} }
  function loadSession(){ try{ const s = localStorage.getItem('frozina_driver'); if(s) session = JSON.parse(s); }catch(e){} }
  function clearSession(){ session = null; try{ localStorage.removeItem('frozina_driver'); }catch(e){} }
  function hdrs(){ return { apikey: SUPABASE_KEY, 'Content-Type':'application/json', Authorization: 'Bearer ' + ((session && session.access_token) || SUPABASE_KEY) }; }

  document.getElementById('lgBtn').addEventListener('click', async () => {
    const email = document.getElementById('lgEmail').value.trim();
    const pass = document.getElementById('lgPass').value;
    const err = document.getElementById('lgErr');
    err.classList.remove('show');
    if(!email || !pass){ err.textContent = 'أدخل البريد وكلمة المرور'; err.classList.add('show'); return; }
    try{
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method:'POST', headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},
        body: JSON.stringify({email, password: pass})
      });
      const data = await res.json();
      if(!res.ok || !data.access_token) throw new Error('login failed');
      saveSession({access_token: data.access_token, user: data.user});
      showBoard();
    }catch(e){ err.textContent = 'تعذّر الدخول — تحقق من البيانات'; err.classList.add('show'); }
  });
  document.getElementById('logoutBtn').addEventListener('click', () => { clearSession(); location.reload(); });

  async function showBoard(){
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('boardView').classList.remove('hidden');
    document.getElementById('logoutBtn').classList.remove('hidden');
    await findMyDriver();
    loadOrders();
    setInterval(loadOrders, 30000);
  }

  // إيجاد سجل السائق المرتبط بحسابي (بالإيميل → user_id أو مطابقة يدوية)
  async function findMyDriver(){
    try{
      // أول: بحث بربط user_id
      let res = await fetch(`${SUPABASE_URL}/rest/v1/drivers?select=*&user_id=eq.${session.user.id}`, {headers: hdrs()});
      let rows = await res.json();
      if(Array.isArray(rows) && rows.length){ myDriver = rows[0]; }
      else{
        // ربط تلقائي: driver1@ → أول سائق نشط بدون user_id (حسب الترتيب)
        const m = (session.user.email||'').match(/driver(\d+)@/);
        res = await fetch(`${SUPABASE_URL}/rest/v1/drivers?select=*&is_active=eq.true&order=id`, {headers: hdrs()});
        rows = await res.json();
        if(Array.isArray(rows) && rows.length){
          const idx = m ? (parseInt(m[1]) - 1) : 0;
          myDriver = rows[idx] || rows[0];
          // اربط الحساب بالسجل لمرات جاية
          if(myDriver && !myDriver.user_id){
            await fetch(`${SUPABASE_URL}/rest/v1/drivers?id=eq.${myDriver.id}`, {
              method:'PATCH', headers: hdrs(), body: JSON.stringify({user_id: session.user.id})
            });
          }
        }
      }
      document.getElementById('helloLbl').textContent = myDriver ? `أهلاً ${myDriver.name} 👋` : '';
    }catch(e){}
  }

  async function loadOrders(){
    if(!myDriver){ document.getElementById('ordersList').innerHTML = '<p class="empty">حسابك غير مربوط بسائق — راجع الإدارة</p>'; return; }
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&driver_id=eq.${myDriver.id}&status=in.(confirmed,preparing,out_for_delivery)&order=batch_id,created_at`, {headers: hdrs()});
      orders = await res.json();
      if(!Array.isArray(orders)) orders = [];
      render();
    }catch(e){
      document.getElementById('ordersList').innerHTML = '<p class="empty">تعذّر التحميل</p>';
    }
  }

  function render(){
    const list = document.getElementById('ordersList');
    if(!orders.length){ list.innerHTML = '<p class="empty">لا توجد طلبات مسندة لك حالياً ✅</p>'; return; }
    list.innerHTML = orders.map(o => {
      const mapBtn = o.location && o.location.lat
        ? `<a class="btn btn-navy" target="_blank" href="https://maps.google.com/?q=${o.location.lat},${o.location.lng}">🗺️ الخريطة</a>`
        : `<a class="btn btn-navy" target="_blank" href="https://maps.google.com/?q=${encodeURIComponent((o.area||'')+' '+(o.address||'')+' Kuwait')}">🗺️ الخريطة</a>`;
      const isOut = o.status === 'out_for_delivery';
      return `
      <div class="order-card">
        <span class="badge ${isOut?'b-out':'b-ready'}">${isOut?'🚗 بالطريق':'📦 جاهز للاستلام'}</span>
        <div class="oc-top">
          <span class="inv">${o.invoice_no||''}</span>
          <span class="tot">${Number(o.total).toFixed(3)} د.ك</span>
        </div>
        <div class="oc-meta">
          <b>${o.customer_name||''}</b><br>
          ${o.area||''} — ${o.address||''}<br>
          ${o.notes ? '📝 ' + o.notes + '<br>' : ''}
        </div>
        <div class="row-btns">
          <a class="btn btn-gold" href="tel:${o.customer_phone}">📞 اتصال</a>
          ${mapBtn}
          ${!isOut
            ? `<button class="btn btn-ok" onclick="setStatus(${o.id}, 'out_for_delivery')">🚗 استلمت — بالطريق</button>`
            : `<button class="btn btn-ok" onclick="setStatus(${o.id}, 'delivered')">✅ تم التسليم</button>`}
        </div>
      </div>`;
    }).join('');
  }

  window.setStatus = async function(orderId, status){
    await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${orderId}`, {
      method:'PATCH', headers: hdrs(), body: JSON.stringify({status})
    });
    loadOrders();
  };

  loadSession();
  if(session && session.access_token) showBoard();
</script>
</body>
</html>
